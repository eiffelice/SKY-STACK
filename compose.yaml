services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_FILE: /app/data/sky-stack.json
      ALLOWED_ORIGINS: "https://${DOMAIN},capacitor://localhost,http://localhost"
    volumes:
      - scores:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
volumes:
  scores:
  caddy_data:
  caddy_config:

